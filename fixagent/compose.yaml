services:
  fixagent:
    build:
      context: .
      dockerfile: Dockerfile
    image: fixagent:v0
    container_name: fixagent-v0
    restart: unless-stopped
    init: true
    ports:
      - "4174:4174"
    environment:
      FIXAGENT_HOST: 0.0.0.0
      FIXAGENT_PORT: 4174
      FIXAGENT_RUNTIME_ROOT: /app/.runtime/cases
      NODE_OPTIONS: --max-old-space-size=512
    volumes:
      - ./.runtime:/app/.runtime
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 1200m
    stop_grace_period: 30s
